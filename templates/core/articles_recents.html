{% load cms_tags thumbnail %}

<div class="row g-4">
    {% for article in articles %}
    <div class="col-md-4">
        <div class="card h-100 border-0 shadow-sm hover-lift">
            {% if article.image_principale %}
            <img src="{% thumbnail article.image_principale 400x250 crop %}" 
                 class="card-img-top" alt="{{ article.titre }}">
            {% endif %}
            <div class="card-body">
                <h5 class="card-title">{{ article.titre }}</h5>
                <p class="card-text text-muted small">{{ article.chapeau|truncatewords:15 }}</p>
                <a href="{{ article.get_absolute_url }}" class="btn btn-sm btn-outline-primary">
                    Lire la suite <i class="bi bi-arrow-right ms-1"></i>
                </a>
            </div>
        </div>
    </div>
    {% endfor %}
</div>
